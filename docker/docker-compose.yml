version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: opensea-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
      
  postgres:
    image: postgres:14
    container_name: opensea-postgres
    environment:
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_USER: opensea
      POSTGRES_DB: opensea_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
      
  redis:
    image: redis:latest
    container_name: opensea-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Component for full-text search
  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: opensea-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # IPFS node for metadata and image storage - cập nhật cấu hình
  ipfs:
    image: ipfs/kubo:latest
    container_name: opensea-ipfs
    ports:
      - "4001:4001"  # Swarm port
      - "5001:5001"  # API port
      - "8080:8080"  # Gateway port
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server   # Cấu hình cho server
      - IPFS_SWARM_ADDR_FILTER=/ip4/172.16.0.0/16   # IPFS sẽ không cố gắng kết nối ra mạng ngoài
    command: >
      sh -c "
        ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin '[\"*\"]' &&
        ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods '[\"PUT\", \"POST\", \"GET\"]' &&
        ipfs daemon --migrate --enable-gc"
    restart: unless-stopped

  # API image server - dịch vụ mới để lưu trữ và phục vụ hình ảnh NFT
  image-server:
    image: node:18-alpine
    container_name: opensea-image-server
    working_dir: /app
    volumes:
      - ../packages/nextjs/public:/app/public
    command: >
      sh -c "
        mkdir -p /app/public/uploads &&
        mkdir -p /app/public/metadata &&
        npm install -g http-server &&
        http-server /app/public -p 3001 --cors"
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  mongodb_data:
  postgres_data:
  elasticsearch_data:
  ipfs_data: